version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mini_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mini_erp_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mini_erp_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Fastify API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      HOST: '0.0.0.0'
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/mini_erp_crm?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_SECRET: 'mini-erp-super-secret-production-jwt-key'
      CORS_ORIGIN: '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend React App (Nginx)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
